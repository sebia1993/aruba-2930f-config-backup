name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validate-and-package:
    name: Windows x64 validation and package
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt

      - name: Install locked runtime and development tools
        shell: pwsh
        run: |
          python -m pip install --no-input pip==26.2.1 setuptools==84.0.0
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap tool installation failed." }
          python -m pip install --no-input -r requirements-lock.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Locked dependency installation failed." }
          python -m pip install --no-input --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw "Editable package installation failed." }

      - name: Run safety, lint, typing, tests, coverage, and audit
        shell: pwsh
        run: ./tools/validate.ps1 -PythonPath python

      - name: Render documentation screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $fontBlobSha = 'b386890ba945e1f39448a6b59f20c5d194f58808'
          $fontApi = "https://api.github.com/repos/google/fonts/git/blobs/$fontBlobSha"
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent' = 'Aruba2930FConfigBackup-CI'
          }
          $fontBlob = Invoke-RestMethod -Uri $fontApi -Headers $headers
          if ($fontBlob.sha -ne $fontBlobSha -or $fontBlob.encoding -ne 'base64') {
            throw 'Pinned Noto Sans KR blob verification failed.'
          }
          $fontPath = Join-Path $env:RUNNER_TEMP 'NotoSansKR.ttf'
          $fontBytes = [Convert]::FromBase64String(($fontBlob.content -replace '\s', ''))
          [IO.File]::WriteAllBytes($fontPath, $fontBytes)
          if ((Get-Item -LiteralPath $fontPath).Length -ne 10414588) {
            throw 'Pinned Noto Sans KR font size verification failed.'
          }
          $env:DOCS_FONT_PATH = $fontPath
          python tools/render_docs_screenshots.py --output artifacts/docs-screenshots
          if ($LASTEXITCODE -ne 0) { throw "Documentation screenshot rendering failed." }

      - name: Upload documentation screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Aruba2930FConfigBackup-docs-screenshots
          path: artifacts/docs-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Build and verify portable package
        shell: pwsh
        run: ./build_windows.ps1 -PythonPath python -Version 0.11.0 -SkipValidation -UseCurrentEnvironment

      - name: Upload verified CI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Aruba2930FConfigBackup-windows-x64-ci
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

      - name: Test local web
        working-directory: local-web
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path ./core).Path
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Local web tests failed.' }
          node --test tests/test_power_matrix.cjs tests/test_manual_queue_ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Port matrix or reservation view tests failed.' }

      - name: Exercise manual reservations in a Windows browser
        working-directory: local-web
        shell: pwsh
        run: |
          python -m pip install --no-input 'playwright==1.65.2' 'greenlet==3.5.6'
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency installation failed.' }
          $env:PYTHONPATH = (Resolve-Path ./core).Path
          python tests/browser_manual_queue.py
          if ($LASTEXITCODE -ne 0) { throw 'Manual reservation browser test failed.' }
          python tests/browser_ping.py
          if ($LASTEXITCODE -ne 0) { throw 'Ping browser workflow failed.' }
          python tests/browser_ping_inventory.py
          if ($LASTEXITCODE -ne 0) { throw 'Ping inventory browser workflow failed.' }
          python tests/browser_ping_analysis.py
          if ($LASTEXITCODE -ne 0) { throw 'Ping history browser workflow failed.' }

      - name: Build and verify local web ZIP
        working-directory: local-web
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'local-web-release'
          python tools/build_release.py --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Local web package build failed.' }

          $packages = @(Get-ChildItem -LiteralPath $output -Filter 'Aruba2930F_Local_Web_v*_Windows_x64.zip' -File)
          if ($packages.Count -ne 1) { throw 'Expected one local web release ZIP.' }
          $zip = $packages[0]
          $checksumFile = [IO.Path]::ChangeExtension($zip.FullName, '.sha256')
          $expected = ((Get-Content -LiteralPath $checksumFile -Raw).Trim() -split '\s+', 2)
          $actual = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash
          if ($expected.Count -ne 2 -or $expected[1] -cne $zip.Name -or $expected[0] -ne $actual) {
            throw 'Local web ZIP name or SHA-256 mismatch.'
          }

          $extracted = Join-Path $env:RUNNER_TEMP 'local-web-extracted'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extracted
          $runtime = Join-Path $extracted 'runtime/python.exe'
          $server = Join-Path $extracted 'server.py'
          $result = & $runtime -B -X utf8 $server --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged local web smoke test failed.' }
          $smoke = $result | ConvertFrom-Json
          if ($smoke.ok -ne $true -or $zip.BaseName -cne "Aruba2930F_Local_Web_v$($smoke.version)_Windows_x64") {
            throw 'Packaged local web identity or health check failed.'
          }

      - name: Upload local web release inputs after Windows smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[web-release] ')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-local-web-release
          path: ${{ runner.temp }}/local-web-release/*
          if-no-files-found: error
          retention-days: 1

  publish-local-web:
    name: Publish requested Windows local web ZIP
    if: >-
      github.repository == 'sebia1993/aruba-2930f-config-backup' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, '[web-release] ')
    needs: windows-validate-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-local-web-release
          path: package
      - name: Publish the checked ZIP at the verified main commit
        working-directory: package
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          entries=(*)
          zips=(Aruba2930F_Local_Web_v*_Windows_x64.zip)
          [[ ${#entries[@]} == 2 && ${#zips[@]} == 1 ]]
          zip=${zips[0]}
          [[ "$zip" =~ ^Aruba2930F_Local_Web_v([0-9]+\.[0-9]+\.[0-9]+)_Windows_x64\.zip$ ]]
          version=${BASH_REMATCH[1]}
          sidecar=${zip%.zip}.sha256
          read -r checksum filename < "$sidecar"
          filename=${filename%$'\r'}
          [[ "$checksum" =~ ^[a-fA-F0-9]{64}$ && "$filename" == "$zip" ]]
          echo "$checksum  $zip" | sha256sum --check --strict -
          tag="web-v$version"
          [[ "$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
          existing=$(gh api "repos/$REPO/git/matching-refs/tags/$tag" --jq '.[].ref')
          if grep -Fxq "refs/tags/$tag" <<< "$existing"; then
            echo "::error::The release tag already exists."
            exit 1
          fi
          subject=$(gh api "repos/$REPO/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]')
          summary=${subject#*] }
          gh release create "$tag" "$zip" "$sidecar" --repo "$REPO" --target "$GITHUB_SHA" \
            --title "Aruba 2930F 로컬 웹 v$version" \
            --notes "$summary

          Windows x64용 ZIP을 압축 해제한 뒤 Start-Local-Web.cmd를 실행하세요. 함께 게시된 SHA-256 파일로 다운로드를 검증할 수 있습니다."
