name: Prepare release
run-name: Prepare ${{ inputs.release_tag }} from main

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
      expected_main_sha:
        description: "Reviewed main commit (full 40-character SHA)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Create annotated tag and dispatch verified release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Verify main and version, create annotated tag, and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          python tools/prepare_release.py \
            --tag "$RELEASE_TAG" \
            --expected-main-sha "$EXPECTED_MAIN_SHA"
